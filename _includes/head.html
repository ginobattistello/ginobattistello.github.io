<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.url == "/" %}
  <title>{{ site.data.profile.name }} · {{ site.data.profile.role }}</title>
  {% else %}
  <title>{{ page.title }} · {{ site.data.profile.name }}</title>
  {% endif %}
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <meta name="author" content="{{ site.data.profile.name }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111111'/><text x='50' y='66' font-size='46' text-anchor='middle' fill='white' font-family='Helvetica,Arial,sans-serif'>{{ site.data.profile.initials }}</text></svg>">
</head>
